spring.application.name=Pet Adoption Center

# Server Config
server.port=${PORT:9090}
server.servlet.session.timeout=30m
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Database Config (PostgreSQL)
# Local dev default assumes a local Postgres server on 5432 with a
# "pet_adoption" database already created (see README for setup).
# In production (Render), DB_URL/DB_USER/DB_PASS are injected as env vars
# pointing at a free-tier Postgres instance (Render Postgres, Supabase, or Neon).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pet_adoption}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Render's free Postgres (and most free-tier providers) require SSL and
# close idle connections aggressively — these settings prevent silent
# connection-pool failures after periods of inactivity.
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# Image storage (Phase 2.5)
# Files are saved into src/main/resources/static/images and served back at
# /images/** (Spring auto-serves anything under static/ from the classpath).
# This is a REPO location, so images survive app restarts/rebuilds locally -
# they're just files sitting in your source tree. Deployment/cloud-storage
# questions (Cloudinary, S3, etc.) are deferred - not relevant right now.
app.upload.dir=${UPLOAD_DIR:src/main/resources/static/images}

# Cloudinary (image hosting) - set these as env vars in production (Render).
# Local dev falls back to empty strings, which will fail on upload if you
# actually try to upload an image locally without setting them - export them
# in your shell or a local .env-style setup if needed.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
