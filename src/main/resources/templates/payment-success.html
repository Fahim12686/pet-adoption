<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Payment Successful - Pet Adoption Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow border-0 mt-5">
                <div class="card-body p-5">
                    <div class="mb-4 text-success">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="currentColor" class="bi bi-check-circle-fill" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                    </div>
                    <h2 class="fw-bold mb-3">Congratulations!</h2>
                    <p class="fs-5 text-muted">Your payment was successful and the adoption process is complete.</p>

                    <div class="bg-light rounded p-3 my-4 d-inline-block">
                        <span class="text-muted d-block mb-1">Transaction ID</span>
                        <code class="fs-5" th:text="${transactionId}">TX-123456789</code>
                    </div>

                    <p class="mb-5">Our staff will contact you shortly with details on picking up your new best friend.</p>

                    <a th:href="@{/dashboard}" class="btn btn-primary btn-lg px-5">Return to Dashboard</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
