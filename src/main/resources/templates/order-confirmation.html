<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmation - Pet Adoption Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Pet Adoption Center</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#paNavbarContent" aria-controls="paNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="paNavbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/pets}">Browse Pets</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/store}">Shop</a></li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body text-center py-5">
                    <div class="mb-4">
                        <span style="font-size: 4rem;">🎉</span>
                    </div>
                    <h2 class="mb-3">Order Confirmed!</h2>
                    <p class="text-muted mb-4">Thank you for your purchase. Your order has been successfully processed.</p>

                    <div class="alert alert-success d-inline-block mb-4">
                        <strong>Order ID:</strong> <span th:text="${order.transactionId}">TXN-XXXX</span>
                    </div>

                    <div class="card bg-light mb-4">
                        <div class="card-body">
                            <h5 class="mb-3">Order Details</h5>
                            <table class="table table-sm mb-0">
                                <tbody>
                                    <tr th:each="item : ${order.items}">
                                        <td th:text="${item.storeItem.name}">Item Name</td>
                                        <td class="text-center" th:text="'x' + ${item.quantity}">1</td>
                                        <td class="text-end" th:text="'$' + ${item.lineTotal}">$0.00</td>
                                    </tr>
                                    <tr class="table-active">
                                        <td colspan="2" class="fw-bold">Total</td>
                                        <td class="text-end fw-bold" th:text="'$' + ${order.totalAmount}">$0.00</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="d-flex gap-3 justify-content-center">
                        <a class="btn btn-primary" th:href="@{/store}">Continue Shopping</a>
                        <a class="btn btn-outline-secondary" th:href="@{/dashboard}">View Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
