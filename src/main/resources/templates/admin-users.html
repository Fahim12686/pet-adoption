<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Users - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Panel</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#paNavbarContent" aria-controls="paNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="paNavbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/pets}">Manage Pets</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/applications}">Applications</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}">Users</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/store}">Manage Store</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/sales}">Sold Items</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="pa-page-header mb-4"><h2 class="mb-0">User Directory</h2></div>
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                <thead class="pa-table-head">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Roles</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}">1</td>
                    <td class="fw-bold" th:text="${user.name}">Name</td>
                    <td th:text="${user.email}">Email</td>
                    <td><small th:text="${#strings.listJoin(user.roles, ', ')}">Roles</small></td>
                    <td>
                        <span class="badge bg-success" th:if="${user.status == 'ACTIVE'}">Active</span>
                        <span class="badge bg-danger" th:if="${user.status == 'SUSPENDED'}">Suspended</span>
                    </td>
                    <td>
                        <form th:if="${user.status == 'ACTIVE' and !#lists.contains(user.roles, 'ROLE_ADMIN')}"
                              th:action="@{/admin/users/{id}/suspend(id=${user.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Suspend</button>
                        </form>
                        <form th:if="${user.status == 'SUSPENDED'}"
                              th:action="@{/admin/users/{id}/unsuspend(id=${user.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-success">Unsuspend</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        </div>
    </div>
    
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
