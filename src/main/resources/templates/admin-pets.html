<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Manage Pets - Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/admin/dashboard}">Admin Panel</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#paNavbarContent" aria-controls="paNavbarContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="paNavbarContent">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" th:href="@{/admin/pets}">Manage Pets</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/applications}">Applications</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}">Users</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/store}">Manage Store</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/admin/sales}">Sold Items</a></li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-link nav-link">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container mt-4">
  <div th:if="${adminPetsError}" class="alert alert-danger" th:text="${adminPetsError}"></div>
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div class="pa-page-header mb-0"><h2 class="mb-0">Manage Pets</h2></div>
    <a th:href="@{/pets/new}" class="btn btn-primary">+ Add New Pet</a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
        <thead class="pa-table-head">
        <tr>
          <th>ID</th>
          <th>Photo</th>
          <th>Name</th>
          <th>Species</th>
          <th>Fee</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pet : ${pets}">
          <td th:text="${pet.id}">1</td>
          <td>
            <img th:if="${pet.imageUrl != null and !pet.imageUrl.isEmpty()}"
                 th:src="${pet.imageUrl}" th:alt="'Thumbnail of ' + ${pet.name}"
                 style="width:48px;height:48px;object-fit:cover;border-radius:6px;">
            <span th:unless="${pet.imageUrl != null and !pet.imageUrl.isEmpty()}" class="text-muted small">—</span>
          </td>
          <td class="fw-bold" th:text="${pet.name}">Name</td>
          <td th:text="${pet.species}">Species</td>
          <td th:text="'$' + ${pet.adoptionFee}">$0.00</td>
          <td>
            <span class="badge bg-success" th:if="${pet.status == 'AVAILABLE'}">Available</span>
            <span class="badge bg-warning text-dark" th:if="${pet.status == 'PENDING'}">Pending</span>
            <span class="badge bg-secondary" th:if="${pet.status == 'ADOPTED'}">Adopted</span>
          </td>
          <td>
            <a th:href="@{/pets/edit/{id}(id=${pet.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
            <a th:href="@{/pets/delete/{id}(id=${pet.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this pet?');">Delete</a>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
    </div>
  </div>
  
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
