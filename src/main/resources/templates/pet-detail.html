<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title th:text="${pet.name} + ' - Profile'">Pet Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container mt-5 mb-5">
    <a th:href="@{/pets}" class="btn btn-secondary mb-3">&larr; Back to Pets</a>
    <div th:if="${petDetailError}" class="alert alert-danger" th:text="${petDetailError}"></div>
    <div class="card shadow-sm pa-detail-card">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0" th:text="'Meet ' + ${pet.name}">Meet Pet</h3>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6">
                    <img th:if="${pet.imageUrl != null and !pet.imageUrl.isEmpty()}"
                         th:src="${pet.imageUrl}" th:alt="${pet.name + ', a ' + pet.breed + ' ' + pet.species}"
                         class="img-fluid rounded mb-3" style="max-height:320px;width:100%;object-fit:cover;">
                    <div th:unless="${pet.imageUrl != null and !pet.imageUrl.isEmpty()}"
                         class="pa-no-photo rounded mb-3"
                         style="height:220px;">
                        <span>🐾</span>
                        <small>No Photo Yet</small>
                    </div>

                    <div class="pa-fact-grid mb-3">
                        <div class="pa-fact"><span class="pa-fact-label">Species</span><span class="pa-fact-value" th:text="${pet.species}"></span></div>
                        <div class="pa-fact"><span class="pa-fact-label">Breed</span><span class="pa-fact-value" th:text="${pet.breed}"></span></div>
                        <div class="pa-fact"><span class="pa-fact-label">Age</span><span class="pa-fact-value" th:text="${pet.age} + ' yrs'"></span></div>
                        <div class="pa-fact"><span class="pa-fact-label">Gender</span><span class="pa-fact-value" th:text="${pet.gender}"></span></div>
                    </div>
                    <div class="pa-fee-badge mb-3">
                        Adoption Fee: <strong th:text="'$' + ${pet.adoptionFee}">$0</strong>
                    </div>

                    <h5>About Me</h5>
                    <p th:text="${pet.description}">Pet description goes here.</p>
                </div>

                <div class="col-md-6">
                    <div class="card pa-apply-card">
                        <div class="card-body">
                            <h4 class="card-title">Apply to Adopt</h4>

                            <!-- Anonymous User Prompt -->
                            <div sec:authorize="isAnonymous()">
                                <p>Please log in or sign up to submit an adoption application.</p>
                                <a th:href="@{/signin}" class="btn btn-primary">Log In</a>
                                <a th:href="@{/signup}" class="btn btn-outline-primary">Sign Up</a>
                            </div>

                            <!-- Authenticated User Form -->
                            <div sec:authorize="isAuthenticated()">
                                <form th:action="@{/adopt/{petId}(petId=${pet.id})}" method="post">
                                    <div class="mb-3">
                                        <label for="reason" class="form-label">Why are you a good fit for this pet?</label>
                                        <textarea class="form-control" id="reason" name="reason" rows="4" required></textarea>
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Submit Application</button>
                                </form>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
