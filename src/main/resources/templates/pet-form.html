<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Pet Form - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${pet.id == null ? 'Add New Pet' : 'Edit Pet'}">Pet Form</h4>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-danger" th:if="${imageError}" th:text="'Image upload failed: ' + ${imageError}"></div>
                    <form th:action="@{/pets/save}" th:object="${pet}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" class="form-control" th:field="*{name}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Species</label>
                                <input type="text" class="form-control" th:field="*{species}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Pet Photo</label>
                                <input type="file" class="form-control" name="imageFile" accept="image/*"
                                       onchange="previewPetImage(event)">
                                <div class="form-text">Upload a photo, or paste an image URL below. Leave both blank when editing to keep the current photo.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">or Image URL</label>
                                <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="https://...">
                            </div>
                        </div>

                        <div class="mb-3" th:if="${pet.imageUrl != null and !pet.imageUrl.isEmpty()}">
                            <img id="petImagePreview" th:src="${pet.imageUrl}" alt="Preview"
                                 style="max-height:160px;border-radius:8px;border:1px solid #ddd;">
                        </div>
                        <div class="mb-3" th:unless="${pet.imageUrl != null and !pet.imageUrl.isEmpty()}" style="display:none;">
                            <img id="petImagePreview" src="" alt="Preview"
                                 style="max-height:160px;border-radius:8px;border:1px solid #ddd;">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Breed</label>
                                <input type="text" class="form-control" th:field="*{breed}">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Age (years)</label>
                                <input type="number" class="form-control" th:field="*{age}" min="0">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Gender</label>
                                <select class="form-select" th:field="*{gender}">
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Adoption Fee ($)</label>
                                <input type="number" step="0.01" class="form-control" th:field="*{adoptionFee}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Status</label>
                                <select class="form-select" th:field="*{status}">
                                    <option value="AVAILABLE">Available</option>
                                    <option value="PENDING">Pending</option>
                                    <option value="ADOPTED">Adopted</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/pets}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Pet</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function previewPetImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const img = document.getElementById('petImagePreview');
        const wrapper = img.closest('div');
        wrapper.style.display = 'block';
        img.src = URL.createObjectURL(file);
    }
</script>
</body>
</html>
