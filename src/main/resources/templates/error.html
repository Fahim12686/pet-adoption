<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Something went wrong - Pet Adoption Center</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container mt-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow border-0 mt-5">
                <div class="card-body p-5">
                    <div class="pa-error-icon mb-3">🐾</div>
                    <h2 class="fw-bold mb-3" th:text="${message} ?: 'Something went wrong.'">Something went wrong.</h2>
                    <p class="text-secondary mb-4" th:if="${status}">
                        Error <span th:text="${status}">500</span> — but don't worry, your good boy/girl is safe.
                    </p>
                    <div class="d-flex gap-3 justify-content-center flex-wrap">
                        <a th:href="@{/}" class="btn btn-primary px-4">Return Home</a>
                        <a th:href="@{/pets}" class="btn btn-outline-primary px-4">Browse Pets</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
