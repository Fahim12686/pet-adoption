<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Store Item Form - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0" th:text="${item.id == null ? 'Add New Store Item' : 'Edit Store Item'}">Store Item Form</h4>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-danger" th:if="${imageError}" th:text="'Image upload failed: ' + ${imageError}"></div>
                    <form th:action="@{/admin/store/save}" th:object="${item}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" th:field="*{name}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Product Photo</label>
                                <input type="file" class="form-control" name="imageFile" accept="image/*"
                                       onchange="previewItemImage(event)">
                                <div class="form-text">Upload a photo, or paste an image URL below. Leave both blank when editing to keep the current photo.</div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">or Image URL</label>
                                <input type="text" class="form-control" th:field="*{imageUrl}" placeholder="https://...">
                            </div>
                        </div>

                        <div class="mb-3" th:if="${item.imageUrl != null and !item.imageUrl.isEmpty()}">
                            <img id="itemImagePreview" th:src="${item.imageUrl}" alt="Preview"
                                 style="max-height:160px;border-radius:8px;border:1px solid #ddd;">
                        </div>
                        <div class="mb-3" th:unless="${item.imageUrl != null and !item.imageUrl.isEmpty()}" style="display:none;">
                            <img id="itemImagePreview" src="" alt="Preview"
                                 style="max-height:160px;border-radius:8px;border:1px solid #ddd;">
                        </div>

                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Category</label>
                                <select class="form-select" th:field="*{category}">
                                    <option value="FOOD">Food</option>
                                    <option value="TOYS">Toys</option>
                                    <option value="ACCESSORIES">Accessories</option>
                                    <option value="GROOMING">Grooming</option>
                                    <option value="BEDS">Beds</option>
                                </select>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Price ($)</label>
                                <input type="number" step="0.01" min="0" class="form-control" th:field="*{price}" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label">Stock Quantity</label>
                                <input type="number" min="0" class="form-control" th:field="*{stockQty}" required>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="activeCheck" th:field="*{active}">
                            <label class="form-check-label" for="activeCheck">Active (visible in store)</label>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" th:field="*{description}" rows="4"></textarea>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a th:href="@{/admin/store}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="submit" class="btn btn-success">Save Item</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    function previewItemImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const img = document.getElementById('itemImagePreview');
        const wrapper = img.closest('div');
        wrapper.style.display = 'block';
        img.src = URL.createObjectURL(file);
    }
</script>
</body>
</html>
